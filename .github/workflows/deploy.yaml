name: Development

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VOCABBEE_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: |
          ssh-keyscan -H "${{ secrets.VOCABBEE_EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Execute script on EC2
        run: |
          ssh ${{ secrets.VOCABBEE_EC2_USER }}@${{ secrets.VOCABBEE_EC2_HOST }} << EOF
          set -e

          cd /home/ubuntu/vocabbee_backend

          git checkout main
          git pull

          docker network create vocabbee-network || true

          # Remove old containers if they exist
          docker rm -f vocabbee-backend || true
          docker rm -f vocabbee-postgres || true

          # Start services
          docker compose \
            -f deploy/compose/docker-compose.yaml \
            --env-file .env.docker \
            up -d --build --remove-orphans

          # Remove unused images
          docker image prune -f

          EOF