services:
  minio:
    image: minio/minio:latest
    container_name: vocabbee-minio
    restart: always
    env_file:
      - ../../.env.docker
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION_NAME: ${MINIO_REGION_NAME:-ap-south-1}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - vocabbee-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: vocabbee-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/vocabbee || true;
      mc anonymous set download local/vocabbee;
      exit 0;
      "
    networks:
      - vocabbee-network

  postgres:
    image: postgres:17
    container_name: vocabbee-postgres
    restart: unless-stopped
    env_file:
      - ../../.env.docker
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-vocabbee}
      - PGSSLMODE=${PGSSLMODE:-disable}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - vocabbee-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: vocabbee-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    networks:
      - vocabbee-network

  backend:
    image: vocabbee-backend:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      tags:
        - vocabbee-backend:latest
    container_name: vocabbee-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB_HOST: postgres
      POSTGRES_DB_PORT: 5432
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME:-vocabbee}
      POSTGRES_DB_USER: ${POSTGRES_DB_USER:-postgres}
      POSTGRES_DB_PASSWORD: ${POSTGRES_DB_PASSWORD:-postgres}
      POSTGRES_DB_SSL_ENABLED: "False"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8011}:8000"
    networks:
      - vocabbee-network
    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  minio_data:
  mailpit_data:

networks:
  vocabbee-network:
    external: true